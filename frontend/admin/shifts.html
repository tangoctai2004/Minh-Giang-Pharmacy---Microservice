<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Ca & Khớp Quỹ — Nhà Thuốc Minh Giang</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- ============ SIDEBAR ============ -->
    <aside class="admin-sidebar">
        <!-- Inject via admin-components.js -->
    </aside>

    <!-- ============ HEADER ============ -->
    <header class="admin-header">
        <!-- Inject via admin-components.js -->
    </header>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="admin-main">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Báo Cáo Ca & Khớp Quỹ</h1>
                <p class="page-subtitle">Kiểm soát giao ca, đối soát tiền mặt và lịch sử đăng nhập Kiosk</p>
            </div>

            <div class="page-actions" style="align-items:center;">
                <!-- Date Range Picker Style Input -->
                <div
                    style="background:#fff;border:1.5px solid var(--admin-border);border-radius:var(--admin-radius);height:40px;display:flex;align-items:center;padding:0 14px;gap:12px;cursor:pointer;">
                    <i class="fa-regular fa-calendar" style="color:#6b7280;font-size:14px;"></i>
                    <span style="font-size:13px;font-weight:600;color:#374151;">01/03/2026 - 05/03/2026</span>
                    <i class="fa-solid fa-chevron-down" style="color:#9ca3af;font-size:11px;"></i>
                </div>

                <button class="btn-primary" style="background:#0f172a;box-shadow:none;">
                    <i class="fa-solid fa-file-excel"></i> Xuất ra Excel
                </button>
            </div>
        </div>

        <!-- Data Table: Shifts History -->
        <div class="inventory-table-container">
            <table class="inventory-table">
                <thead>
                    <tr>
                        <th width="15%">Thu ngân</th>
                        <th width="18%">Thời gian mở/đóng ca</th>
                        <th width="12%">Hệ thống tính</th>
                        <th width="12%">Thu ngân đếm</th>
                        <th width="15%">Chênh lệch</th>
                        <th width="12%">Trạng thái</th>
                        <th width="16%" style="text-align:right;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="shiftsTableBody">
                    <!-- Dynamic shifts will be loaded here -->
                </tbody>
            </table>

            <!-- Pagination -->
            <div class="pagination">
                <span class="page-info">Hiển thị 1 - 4 trên 68 báo cáo giao ca</span>
                <div class="page-controls">
                    <button class="btn-page" disabled><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="btn-page active">1</button>
                    <button class="btn-page">2</button>
                    <button class="btn-page">...</button>
                    <button class="btn-page">17</button>
                    <button class="btn-page"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

    </main>

    <!-- ============ SCRIPTS ============ -->
    <script>
        const API_BASE = (localStorage.getItem('MG_API_BASE') || (
            (window.location.origin.includes('localhost:5500') ||
             window.location.origin.includes('localhost:5501') ||
             window.location.origin.includes('127.0.0.1:5500') ||
             window.location.origin.includes('127.0.0.1:5501'))
            ? 'http://localhost:8000/api'
            : window.location.origin.replace(/\/+$/, '') + '/api'
        )) + '/identity';

        function getAdminToken() {
            const authRaw = localStorage.getItem('MG_ADMIN_AUTH');
            if (authRaw) {
                const parsed = JSON.parse(authRaw);
                return parsed.accessToken;
            }
            return '';
        }

        function formatVND(val) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val);
        }

        function formatDateTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleString('vi-VN', { 
                hour: '2-digit', 
                minute: '2-digit',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        async function loadShifts() {
            const tbody = document.getElementById('shiftsTableBody');
            if (!tbody) return;

            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;">Đang tải danh sách ca...</td></tr>';

            try {
                const token = getAdminToken();
                if (!token) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#ef4444;">Vui lòng đăng nhập quản trị viên.</td></tr>';
                    return;
                }

                const res = await fetch(`${API_BASE}/shifts`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const result = await res.json();
                if (result.success) {
                    const shifts = result.data || [];
                    if (shifts.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;">Không có ca làm việc nào.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = shifts.map(s => {
                        const openedBy = s.opened_by_name || 'Thu ngân';
                        const startStr = formatDateTime(s.shift_start);
                        const endStr = s.shift_end ? formatDateTime(s.shift_end) : 'Đang mở';
                        
                        const openCash = parseFloat(s.opening_cash) || 0;
                        const closingCash = s.closing_cash !== null ? parseFloat(s.closing_cash) : null;
                        const expectedCash = parseFloat(s.expected_closing_cash) || 0;
                        const diff = parseFloat(s.cash_difference) || 0;

                        let diffHtml = '';
                        let statusBadgeHtml = '';
                        let actionHtml = '';

                        if (s.status === 'open' || !s.shift_end) {
                            diffHtml = '<span style="font-size:13px;color:#6b7280;">Đang mở ca</span>';
                            statusBadgeHtml = '<span class="status-badge" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;">Đang mở</span>';
                            actionHtml = `
                                <div class="action-btns" style="justify-content:flex-end;">
                                    <span style="font-size:12px;color:#9ca3af;font-style:italic;">Chưa chốt ca</span>
                                </div>
                            `;
                        } else {
                            if (diff === 0) {
                                diffHtml = '<span style="font-size:14px;font-weight:800;color:#10b981;"><i class="fa-solid fa-check"></i> 0 ₫ (Khớp)</span>';
                                statusBadgeHtml = '<span class="status-badge active" style="background:#f0fdf4;color:#15803d;border-color:#bbf7d0;">Đã khớp</span>';
                                actionHtml = `
                                    <div class="action-btns" style="justify-content:flex-end;">
                                        <button class="btn-icon" title="Xem chi tiết doanh thu" onclick="alert('Chi tiết doanh thu ca: ${formatVND(expectedCash)}')"><i class="fa-solid fa-chart-line"></i></button>
                                    </div>
                                `;
                            } else {
                                const sign = diff > 0 ? '+' : '';
                                const term = diff > 0 ? 'Dư' : 'Thiếu';
                                const color = diff > 0 ? '#059669' : '#dc2626';
                                const icon = diff > 0 ? 'fa-arrow-up' : 'fa-arrow-down';
                                diffHtml = `<span style="font-size:14px;font-weight:800;color:${color};"><i class="fa-solid ${icon}"></i> ${sign}${formatVND(diff)} (${term})</span>`;

                                if (s.reconciliation_status === 'approved') {
                                    statusBadgeHtml = '<span class="status-badge active" style="background:#f0fdf4;color:#15803d;border-color:#bbf7d0;">Đã duyệt</span>';
                                    actionHtml = `
                                        <div class="action-btns" style="justify-content:flex-end;">
                                            <span style="font-size:12px;color:#059669;font-weight:600;"><i class="fa-solid fa-circle-check"></i> Đã duyệt bù/thu</span>
                                        </div>
                                    `;
                                } else {
                                    statusBadgeHtml = '<span class="status-badge inactive" style="background:#fffbeb;color:#b45309;border-color:#fde68a;">Chờ xử lý</span>';
                                    actionHtml = `
                                        <div class="action-btns" style="justify-content:flex-end;">
                                            <button class="btn-secondary" style="height:32px;font-size:12px;padding:0 12px;color:#047857;border-color:#10b981;" onclick="approveShiftReconciliation(${s.id}, ${diff})">Duyệt lệch</button>
                                        </div>
                                    `;
                                }
                            }
                        }

                        const closingCashStr = closingCash !== null ? formatVND(closingCash) : '-';
                        const expectedCashStr = s.shift_end ? formatVND(expectedCash) : '-';

                        return `
                            <tr>
                                <td>
                                    <div class="inv-name">${escapeHtml(openedBy)}</div>
                                    <div style="font-size:12px;color:#6b7280;">Kiosk #${s.kiosk_id || 'N/A'}</div>
                                </td>
                                <td>
                                    <div style="font-weight:600;color:#1f2937;">${startStr.split(' ')[1] || startStr}</div>
                                    <div style="font-size:12px;color:#6b7280;">
                                        <span style="color:#10b981;">Bắt đầu: ${startStr}</span> <br/>
                                        <span style="color:#ef4444;">Chốt: ${endStr}</span>
                                    </div>
                                </td>
                                <td><span class="inv-price" style="font-size:14px;color:#4b5563;">${expectedCashStr}</span></td>
                                <td><span class="inv-price" style="font-size:14px;color:#0f172a;">${closingCashStr}</span></td>
                                <td>${diffHtml}</td>
                                <td>${statusBadgeHtml}</td>
                                <td>${actionHtml}</td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:#ef4444;">Lỗi: ${result.message}</td></tr>`;
                }
            } catch (error) {
                console.error("Error loading shifts:", error);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#ef4444;">Lỗi kết nối máy chủ.</td></tr>';
            }
        }

        async function approveShiftReconciliation(id, diff) {
            const label = diff > 0 ? "thu dư" : "bù tiền";
            const confirmMsg = `Bạn có chắc chắn muốn duyệt lệch ca này (hành động: ${label} với chênh lệch ${formatVND(diff)})?`;
            if (!confirm(confirmMsg)) return;

            const note = prompt("Nhập ghi chú phê duyệt (không bắt buộc):") || `Duyệt chênh lệch ca ${label}`;

            try {
                const token = getAdminToken();
                if (!token) return;

                const response = await fetch(`${API_BASE}/shifts/${id}/reconcile/approve`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ approval_note: note })
                });

                const result = await response.json();
                if (result.success) {
                    showToast('Phê duyệt chênh lệch ca thành công!', 'success');
                    loadShifts();
                } else {
                    showToast('Lỗi: ' + result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                showToast('Lỗi kết nối máy chủ.', 'error');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Set active sidebar link safely without erroring if missing
        const activeLink = document.querySelector('.sidebar-link[href="shifts.html"]');
        if (activeLink) {
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            activeLink.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', loadShifts);
    </script>

    <!-- Shared Layout Components -->
    <script src="js/admin-components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderAdminLayout('shifts');
        });
    </script>
</body>

</html>
